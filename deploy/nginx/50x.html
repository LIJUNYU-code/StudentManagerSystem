<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>服务暂时不可用</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            background: #0f0f12; color: #c8c8cc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .box { text-align: center; max-width: 420px; padding: 0 24px; }
        .code { font-size: 64px; font-weight: 600; letter-spacing: -2px; color: #3a3a3f; line-height: 1; }
        h1 { font-size: 20px; font-weight: 500; margin: 16px 0 8px; color: #e8e8ec; }
        p { font-size: 14px; line-height: 1.7; margin: 0 0 6px; color: #8e8e93; }
        .hint { margin-top: 24px; padding: 14px 18px; border-radius: 12px; background: #1a1a1e; font-size: 13px; text-align: left; color: #a0a0a6; }
        code { color: #34c759; font-family: ui-monospace, Consolas, monospace; }
    </style>
</head>
<body>
<div class="box">
    <div class="code">502</div>
    <h1>后端服务未启动</h1>
    <p>页面本身是正常的，但 API 服务没有响应。</p>
    <p>通常是 Spring Boot 应用没有运行，或正在重启。</p>
    <div class="hint">
        排查步骤：<br>
        1. 确认后端已在 <code>8080</code> 端口启动<br>
        2. 查看 <code>deploy/nginx/logs/classhub-error.log</code><br>
        3. 后端就绪后刷新本页即可
    </div>
</div>
</body>
</html>
