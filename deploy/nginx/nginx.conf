# ClassHub 生产部署配置（Windows 本机验证版）
#
# 设计要点：
#   1. 单端口（8088）同时服务前端页面和后端 API —— 前后端同源，彻底消除跨域问题。
#   2. /api/ 开头的请求转发给后端，并【去掉 /api 前缀】——与开发期 vite.config.js
#      的 rewrite 规则保持一致，所以前端代码一行都不用改就能上生产。
#   3. 其余路径走静态文件，找不到文件时回退到 /index.html ——
#      这是 Vue history 路由（createWebHistory）的必要配置。
#      没有它，用户在 /students 页面按 F5 会得到 404。
#
# 用法：
#   nginx.exe -t -c <本文件绝对路径>      # 检查语法
#   nginx.exe -c <本文件绝对路径>          # 启动
#   nginx.exe -s reload -c <本文件绝对路径>  # 改配置后平滑重载
#   nginx.exe -s stop -c <本文件绝对路径>    # 停止

worker_processes  1;

# 日志放在 nginx 自己的 logs 目录，便于排查
error_log  logs/classhub-error.log warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 访问日志：记录状态码和耗时，验证部署时非常有用
    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent ${request_time}s "$http_referer"';
    access_log  logs/classhub-access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 前端产物里最大的文件是 login-bg.png（约 800KB），开 gzip 后体积能降很多。
    # 注意：图片本身已是压缩格式，gzip 收益低，所以只对文本类型启用。
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    server {
        listen       8088;
        server_name  localhost;

        # 前端静态文件根目录（Windows 路径用正斜杠，含空格需整体加引号）
        root   D:/software/demo/web/dist;
        index  index.html;

        # ---------- 后端 API ----------
        # 关键：proxy_pass 末尾的 "/" 不能省。
        #   带 "/" → /api/student 转发为 /student        （去掉前缀，与 vite 代理一致）
        #   不带 "/" → /api/student 转发为 /api/student  （后端没有 /api 前缀，会 404）
        location /api/ {
            proxy_pass         http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 后端接口都很快，但登录/批量录入可能要等，给 30 秒
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # ---------- 带哈希指纹的静态资源 ----------
        # Vite 产物文件名含 content hash（index-DUJmfIQo.js），内容变则文件名变，
        # 所以可以放心让浏览器缓存一年。这是生产环境最重要的性能配置之一。
        #
        # 注意：只用 add_header，不要再用 expires 指令。
        # expires 1y 会自己生成一个 "Cache-Control: max-age=31536000"，
        # 与这里的 add_header 叠加会输出【两个】Cache-Control 头，
        # 而浏览器通常只取第一个 —— immutable 就白写了。
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # ---------- 前端路由回退 ----------
        # try_files 依次尝试：①精确文件 ②目录 ③回退 index.html
        # 第③步是 Vue history 路由的关键：/students 在磁盘上没有对应文件，
        # 交给 index.html 后由 vue-router 接管渲染。
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html 本身【不能】缓存：它是所有哈希资源的入口，
        # 一旦被缓存，用户发版后仍会加载旧 index.html → 引用已删除的旧 js → 白屏。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 反向代理常见的 502/504 友好提示（后端没起时看日志能立刻判断）
        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root  html;
        }
    }
}
